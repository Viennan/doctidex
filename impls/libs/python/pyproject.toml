[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "whero-doctidex"
version = "0.1.0"
description = "Shared doctidex protocol and Git agent tooling"
requires-python = ">=3.11"
dependencies = [
  "markdown-it-py>=3.0,<5",
  "regex==2026.7.19",
  "ruamel.yaml>=0.18,<0.19",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
  "ruff==0.16.0",
]

[project.scripts]
doctidex-git = "whero.doctidex.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["whero.doctidex*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
