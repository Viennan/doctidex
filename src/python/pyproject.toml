[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whero-doctidex"
version = "2.2.2"
description = "doctidex-git v2 command-line tooling"
requires-python = ">=3.12"
dependencies = [
  "markdown-it-py>=3,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.16,<0.17",
]

[project.scripts]
doctidex-git = "whero.doctidex.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["whero.doctidex*"]
namespaces = true

[tool.setuptools.package-data]
"whero.doctidex" = ["_skill_data/**/*"]

[tool.pytest.ini_options]
addopts = "-q -m 'not validator_script'"
testpaths = ["tests"]
markers = [
  "validator_script: tests for scripts/validate-user-doc-links.py; run explicitly and excluded from the default suite",
  "no_cover: pytest-cov marker that disables coverage collection for the marked module",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
